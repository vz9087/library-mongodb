<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Manager</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;background:#f5f6fa;color:#222}
  h1{margin-bottom:4px}
  .stats{display:flex;gap:12px;margin:16px 0}
  .stat{flex:1;background:#fff;padding:12px;border-radius:8px;text-align:center;box-shadow:0 1px 3px #0001}
  .stat b{display:block;font-size:24px}
  form,.search{background:#fff;padding:14px;border-radius:8px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 1px 3px #0001}
  input{padding:8px;border:1px solid #ccc;border-radius:6px;flex:1;min-width:120px}
  button{padding:8px 12px;border:0;border-radius:6px;background:#3b5bdb;color:#fff;cursor:pointer}
  button.del{background:#e03131} button.ret{background:#2f9e44}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
  th{background:#edf0ff}
</style>
</head>
<body>
<h1>Library Manager</h1>
<p>Node.js + Express + MongoDB</p>
<div class="stats" id="stats"></div>

<form id="addForm">
  <input name="title" placeholder="Title" required>
  <input name="author" placeholder="Author" required>
  <input name="isbn" placeholder="ISBN" required>
  <input name="category" placeholder="Category">
  <input name="copies" type="number" min="1" placeholder="Copies" required>
  <button>Add Book</button>
</form>

<div class="search">
  <input id="q" placeholder="Search title or author...">
  <button onclick="load()">Search</button>
</div>

<table>
  <thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th>Issued To</th><th>Actions</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const api = '/api/books';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const q = document.getElementById('q').value;
  const books = await (await fetch(api + (q ? '?search=' + encodeURIComponent(q) : ''))).json();
  document.getElementById('rows').innerHTML = books.map(b => `
    <tr>
      <td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td>
      <td>${b.available}/${b.copies}</td>
      <td>${b.issues.map(i => esc(i.member)).join(', ') || '-'}</td>
      <td>
        <button onclick="issue('${b._id}')">Issue</button>
        <button class="ret" onclick="ret('${b._id}')">Return</button>
        <button class="del" onclick="del('${b._id}')">Delete</button>
      </td>
    </tr>`).join('');
  stats();
}

async function stats() {
  const s = await (await fetch(api + '/stats')).json();
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${s.totals.titles}</b>Titles</div>
     <div class="stat"><b>${s.totals.copies}</b>Total Copies</div>
     <div class="stat"><b>${s.totals.available}</b>Available</div>`;
}

document.getElementById('addForm').onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  body.copies = Number(body.copies);
  const r = await fetch(api, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) alert((await r.json()).error);
  e.target.reset(); load();
};

async function issue(id) {
  const member = prompt('Member name:'); if (!member) return;
  const r = await fetch(`${api}/${id}/issue`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({member}) });
  if (!r.ok) alert((await r.json()).error); load();
}
async function ret(id) {
  const member = prompt('Returning member name:'); if (!member) return;
  const r = await fetch(`${api}/${id}/return`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({member}) });
  if (!r.ok) alert((await r.json()).error); load();
}
async function del(id) {
  if (!confirm('Delete this book?')) return;
  await fetch(`${api}/${id}`, { method:'DELETE' }); load();
}
load();
</script>
</body>
</html>
